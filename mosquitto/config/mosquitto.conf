# Mosquitto 2.x – broker for MeshCore observer -> Discord bot
persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Plain MQTT (LAN). Expose 8883 + TLS if the node publishes over the internet.
listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
